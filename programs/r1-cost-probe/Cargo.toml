[package]
name = "aspis-r1-cost-probe-program"
edition.workspace = true
license.workspace = true
version.workspace = true
description = "UNPROVED R1 COST PROBE SBF entrypoint"
[lib]
crate-type = ["cdylib", "lib"]
[features]
default = ["custom-heap"]
custom-heap = []
custom-panic = []
# Internal phase/CU diagnostics are opt-in; release verification has no observer.
cu-profiling = []
no-entrypoint = []
pool-adapter = []
# Kept for the pinned build command lines; the adopted compact binary-multiproof
# format (PREREG-PROOF-SIZE-2) is defined over private leaf salts, which the
# verifier crate now enables by default.
private-leaf-salts = ["aspis-r1-cost-probe/private-leaf-salts"]
[dependencies]
aspis-r1-cost-probe = { path = "../../crates/aspis-r1-cost-probe", features = ["optimized-terminal", "program-build"] }
aspis-statement = { path = "../../crates/aspis-statement", features = ["r0", "pool-v1-kernel"] }
solana-program.workspace = true
aspis-core = { path = "../../crates/aspis-core" }
