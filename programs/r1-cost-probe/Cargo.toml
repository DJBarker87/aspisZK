[package]
name = "aspis-r1-cost-probe-program"
edition.workspace = true
license.workspace = true
version.workspace = true
description = "UNPROVED R1 COST PROBE SBF entrypoint"
[lib]
crate-type = ["cdylib", "lib"]
[features]
default = ["custom-heap"]
custom-heap = []
custom-panic = []
# Internal phase/CU diagnostics are opt-in; release verification has no observer.
cu-profiling = ["aspis-r1-cost-probe/phase-observer"]
# Future-version experiment: finer phase markers inside the semantic layer.
detail-phases = ["aspis-r1-cost-probe/detail-phases"]
# Future-version experiment: the sixteen-product QM31 multiplication everywhere.
future-fast-kmul = ["aspis-core/future-fast-kmul"]
future-fast-prepared = ["aspis-core/future-fast-prepared"]
future-fast-square = ["aspis-core/future-fast-square"]
future-validated-decode = ["aspis-r1-cost-probe/future-validated-decode"]
future-merkle-single-pass = ["aspis-r1-cost-probe/future-merkle-single-pass"]
future-tight-base = ["aspis-r1-cost-probe/future-tight-base"]
future-tight-ext = ["aspis-r1-cost-probe/future-tight-ext"]
future-tight-weights = ["aspis-r1-cost-probe/future-tight-weights"]
future-lazy-boundary = ["aspis-r1-cost-probe/future-lazy-boundary"]
future-d-inactive-tensor = ["aspis-r1-cost-probe/future-d-inactive-tensor"]
future-d-pair-expansion = ["aspis-r1-cost-probe/future-d-pair-expansion"]
future-merkle-in-place = ["aspis-r1-cost-probe/future-merkle-in-place"]
future-lean-parse = ["aspis-r1-cost-probe/future-lean-parse"]
future-lazy-horner = ["aspis-core/future-lazy-horner", "aspis-r1-cost-probe/future-lazy-horner"]
future-word-scan = ["aspis-r1-cost-probe/future-word-scan"]
future-dot-scale = ["aspis-r1-cost-probe/future-dot-scale"]
future-claim-rows = ["aspis-r1-cost-probe/future-claim-rows"]
future-fold-shared = ["aspis-r1-cost-probe/future-fold-shared"]
future-lean-dot = ["aspis-r1-cost-probe/future-lean-dot"]
# One transaction through the Pool adapter: the settlement entry verifies the
# whole proof (stage D path) instead of resuming a checkpoint.
future-one-tx = ["pool-adapter"]
# One-transaction adapter without the stage 1 entry (smaller ELF; same stage 2 path).
future-one-tx-lean = ["future-one-tx"]
no-entrypoint = []
pool-adapter = []
# Kept for the pinned build command lines; the adopted compact binary-multiproof
# format (PREREG-PROOF-SIZE-2) is defined over private leaf salts, which the
# verifier crate now enables by default.
private-leaf-salts = ["aspis-r1-cost-probe/private-leaf-salts"]
[dependencies]
aspis-r1-cost-probe = { path = "../../crates/aspis-r1-cost-probe", features = ["optimized-terminal", "program-build"] }
aspis-statement = { path = "../../crates/aspis-statement", features = ["r0", "pool-v1-kernel"] }
solana-program.workspace = true
aspis-core = { path = "../../crates/aspis-core" }
