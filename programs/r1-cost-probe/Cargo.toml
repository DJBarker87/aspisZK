[package]
name = "aspis-r1-cost-probe-program"
edition.workspace = true
license.workspace = true
version.workspace = true
description = "UNPROVED R1 COST PROBE SBF entrypoint"
[lib]
crate-type = ["cdylib", "lib"]
[features]
default = ["custom-heap"]
custom-heap = []
custom-panic = []
# Internal phase/CU diagnostics are opt-in; release verification has no observer.
cu-profiling = ["aspis-r1-cost-probe/phase-observer"]
# Finer phase markers inside the semantic layer (profiling builds only).
detail-phases = ["aspis-r1-cost-probe/detail-phases"]
# The deployed Aspis program: exactly the settings below, with the Pool adapter
# and private leaf salts. Build with `--features aspis`.
aspis = [
    "pool-adapter",
    "one-tx",
    "private-leaf-salts",
    "fast-kmul",
    "fast-prepared",
    "fast-square",
    "validated-decode",
    "merkle-single-pass",
    "tight-base",
    "tight-weights",
    "lazy-boundary",
    "final-pair-expansion",
    "merkle-in-place",
    "lazy-horner",
    "fold-shared",
]
# QM31 multiplication as sixteen limb products with one reduction per limb.
fast-kmul = ["aspis-core/fast-kmul"]
# The prepared QM31 multiplier through the sixteen-product kernel.
fast-prepared = ["aspis-core/fast-prepared"]
# QM31 squaring with delayed reduction.
fast-square = ["aspis-core/fast-square"]
# Semantic records already checked canonical are decoded without checking again.
validated-decode = ["aspis-r1-cost-probe/validated-decode"]
# One Merkle traversal per tree, counting nodes while verifying.
merkle-single-pass = ["aspis-r1-cost-probe/merkle-single-pass"]
# Base-lane kernel of the batched first fold reading limbs once.
tight-base = ["aspis-r1-cost-probe/tight-base"]
# Query weight accumulation through the same limb-wise kernel.
tight-weights = ["aspis-r1-cost-probe/tight-weights"]
# Semantic boundary sum with one reduction per limb.
lazy-boundary = ["aspis-r1-cost-probe/lazy-boundary"]
# Query weight extension of the final sumcheck expanded in pairs.
final-pair-expansion = ["aspis-r1-cost-probe/final-pair-expansion"]
# Merkle parents written straight into the next level's buffer.
merkle-in-place = ["aspis-r1-cost-probe/merkle-in-place"]
# Multiply-add with one reduction per limb, and the semantic value through it.
lazy-horner = ["aspis-core/lazy-horner", "aspis-r1-cost-probe/lazy-horner"]
# Second fold with the edge products shared between the two sums.
fold-shared = ["aspis-r1-cost-probe/fold-shared"]
# One transaction through the Pool adapter: the settlement entry verifies the
# whole proof instead of resuming a checkpoint, and the two-transaction
# stage 1 entry is not compiled.
one-tx = ["pool-adapter"]
no-entrypoint = []
pool-adapter = []
# Kept for the pinned build command lines; the adopted compact binary-multiproof
# format (PREREG-PROOF-SIZE-2) is defined over private leaf salts, which the
# verifier crate now enables by default.
private-leaf-salts = ["aspis-r1-cost-probe/private-leaf-salts"]
[dependencies]
aspis-r1-cost-probe = { path = "../../crates/aspis-r1-cost-probe", features = ["optimized-terminal", "program-build"] }
aspis-statement = { path = "../../crates/aspis-statement", features = ["r0", "pool-v1-kernel"] }
solana-program.workspace = true
aspis-core = { path = "../../crates/aspis-core" }
