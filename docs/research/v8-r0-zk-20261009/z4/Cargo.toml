[package]
name = "aspis-z4b-probe"
version = "0.1.0"
edition = "2021"
[workspace]
[dependencies]
aspis-core = { path = "../../../../crates/aspis-core", features = ["r0"] }
aspis-statement = { path = "../../../../crates/aspis-statement", features = ["r0"] }
aspis-prover = { path = "../../../../crates/aspis-prover", features = ["r0"] }
aspis-r1-cert-check = { path = "../c3/check", features = ["native-kernels"] }
aspis-r1-cert-build = { path = "../c3/build", features = ["native-kernels"] }
[lib]
name = "aspis_z4b_probe"
path = "r1p_lib.rs"
[[bin]]
name = "probe"
path = "probe.rs"
[profile.release]
opt-level = 3
overflow-checks = true
