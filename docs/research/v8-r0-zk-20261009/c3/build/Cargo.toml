[package]
name = "aspis-r1-cert-build"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[profile.release]
opt-level = 3
overflow-checks = true

[workspace]

[features]
native-kernels = []
native-workers = ["native-kernels", "dep:aspis-r1-cert-check"]

[dependencies]
aspis-r1-cert-check = {path="../check",features=["native-workers"],optional=true}
