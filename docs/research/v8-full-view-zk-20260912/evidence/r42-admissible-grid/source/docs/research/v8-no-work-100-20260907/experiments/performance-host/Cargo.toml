[package]
name = "aspis-v8-performance-host"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[[bin]]
name = "aspis-v8-performance-host"
path = "../relation_callback.rs"

[features]
selected-v7-kernels = [
 "aspis-core/v7-gamma-four-slot-block-audit",
 "aspis-statement/pool-v1-pair-forest-packed-digest-selector-tensor-audit",
 "aspis-statement/pool-v1-pair-forest-binary-copy-weights-audit",
 "aspis-statement/pool-v1-pair-forest-endpoint-selector-cache-audit",
 "aspis-statement/pool-v1-pair-forest-semantic-factor-audit",
 "aspis-statement/pool-v1-pair-forest-pattern-window-audit",
 "aspis-statement/pool-v1-pair-forest-copy-tag-dot-basis-audit",
 "aspis-statement/pool-v1-pair-forest-copy-finish-dot-basis-audit",
 "aspis-statement/pool-v1-pair-forest-packed-range-audit",
 "aspis-statement/pool-v1-pair-forest-active-mask-basis-audit",
]
insecure-spend-fixture = []

[dependencies]
aspis-core = { path = "../../../../../crates/aspis-core" }
aspis-statement = { path = "../../../../../crates/aspis-statement", features = ["spend-dynamic-rate512", "pool-v1-kernel"] }
sha2 = "=0.10.9"
zeroize = "=1.8.1"
getrandom = "=0.3.4"

[profile.release]
opt-level = 3
debug = false
codegen-units = 1

[[bin]]
name = "r17-export-basis"
path = "../r17_export_basis.rs"

[[bin]]
name="r17-tensor-check"
path="../r17_tensor_check.rs"

[[bin]]
name="r17-fast-g-generate"
path="../r17_fast_g_generate.rs"

[[bin]]
name="r17-merge-generate"
path="../r17_merge_generate.rs"

[[bin]]
name="r17-baseline-reuse-check"
path="../r17_baseline_reuse_check.rs"

[[bin]]
name="r17-compact-transport-check"
path="../r17_compact_transport_check.rs"

[[bin]]
name="r17-compact-ordinary-check"
path="../r17_compact_ordinary_check.rs"

[[bin]]
name="r17-compact-workspace-check"
path="../r17_compact_workspace_check.rs"

[[bin]]
name="r17-compact-prepare-check"
path="../r17_compact_prepare_check.rs"

[[bin]]
name="r17-carry-shortcuts-check"
path="../r17_carry_shortcuts_check.rs"

[[bin]]
name="r18-shared-ordinary-check"
path="../r18_shared_ordinary_check.rs"
[[bin]]
name="r18-sparse-coded-g-check"
path="../r18_sparse_coded_g_check.rs"

[[bin]]
name="r18-minimal-transport-check"
path="../r18_minimal_transport_check.rs"

[[bin]]
name = "r24-dot-check"
path = "../r24_dot_check.rs"

[[bin]]
name="r27-check"
path="../r27_check.rs"

[[bin]]
