[package]
name = "aspis-r1-adapter-reconstruct"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "lib.rs"

[features]
default = []
pool-adapter = []
private-leaf-salts = []

[dependencies]
aspis-statement = { path = "../../crates/aspis-statement", features = ["r0", "pool-v1-kernel"] }
solana-program-error = { version = "=2.2.2", features = ["serde", "borsh"] }
