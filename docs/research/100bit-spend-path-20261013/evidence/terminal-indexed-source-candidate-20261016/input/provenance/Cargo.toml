[workspace]
members = ["crates/aspis-core", "crates/aspis-statement"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
aspis-core = { path = "crates/aspis-core" }
sha2 = "0.10.8"

[profile.release.build-override]
opt-level = 3
