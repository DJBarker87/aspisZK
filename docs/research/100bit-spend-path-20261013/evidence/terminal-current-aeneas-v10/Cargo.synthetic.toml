[package]
name = "aspis-r1-mask-extraction-probe"
version = "0.0.0"
edition = "2021"
publish = false
build = "build.rs"

[lib]
path = "src/lib.rs"

[workspace]

[features]
default = []
formal-verification = []
insecure-test-framing = []
insecure-test-logup-compression = []
insecure-test-ordering = []
pool-v1-kernel = []
pool-v1-pair-forest-active-mask-basis-audit = []
pool-v1-pair-forest-binary-copy-weights-audit = []
pool-v1-pair-forest-copy-finish-dot-basis-audit = []
pool-v1-pair-forest-copy-pattern-basis-audit = []
pool-v1-pair-forest-copy-selector-tensor-basis-audit = []
pool-v1-pair-forest-copy-tag-dot-basis-audit = []
pool-v1-pair-forest-endpoint-selector-cache-audit = []
pool-v1-pair-forest-packed-digest-audit = []
pool-v1-pair-forest-packed-digest-selector-tensor-audit = []
pool-v1-pair-forest-packed-range-audit = []
pool-v1-pair-forest-pattern-window-audit = []
pool-v1-pair-forest-semantic-factor-audit = []
r0 = []
r0-e4-reference = []
r0-hoist-reference = []
r0-op-count = []
r0-r91-audit = []
spend-dynamic-rate512 = []
v7-fixed-canonical-audit = []
v7-fixed-canonical-exact-once-audit = []
v7-gamma-four-slot-block-audit = []

[profile.release]
opt-level = 3
overflow-checks = true

[profile.release.build-override]
opt-level = 3

[target.'cfg(not(target_os = "solana"))'.dependencies]
aspis-r0-writer-copies = { path = "../docs/research/v8-r0-zk-20261009/refine/writers" }
aspis-r0-block-writer-copies = { path = "../docs/research/v8-r0-zk-20261009/refine/blockwriters" }
aspis-r0-poseidon-copy = { path = "../docs/research/v8-r0-zk-20261009/refine/poseidon" }
