[package]
name = "s2i-native-children"
version = "0.1.0"
edition = "2021"
[workspace]
[dependencies]
aspis-statement = { path = "../native-source/crates/aspis-statement", features = ["r0", "pool-v1-kernel"] }
aspis-core = { path = "../native-source/crates/aspis-core", features = ["r0"] }
solana-program-error = "=2.2.2"
[profile.dev]
opt-level = 3
debug = 0
[profile.release]
opt-level = 3
