[package]
name="aspis-r1-cost-probe"
version="0.1.0"
edition="2021"
[workspace]
[features]
default=["private-leaf-salts"]
private-leaf-salts=[]
prover=[]
r1p-check=[]
[dependencies]
aspis-core={path="../core-workspace/crates/aspis-core",features=["r0"]}
[profile.release]
opt-level=3
overflow-checks=true

[profile.dev]
opt-level=3
overflow-checks=true
[profile.dev.build-override]
opt-level=3

[lib]
path="src/probe_safe_claims.rs"
