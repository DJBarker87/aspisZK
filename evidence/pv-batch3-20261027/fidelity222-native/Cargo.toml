[package]
name="pv-b3-fidelity222-native"
version="0.0.0"
edition="2021"
[workspace]
[features]
prover=[]
[[bin]]
name="fidelity222-native"
path="main.rs"
required-features=["prover"]
[dependencies]
aspis-prover={path="../../../crates/aspis-prover",features=["r0","prover","insecure-spend-fixture"]}
aspis-statement={path="../../../crates/aspis-statement",features=["r0","pool-v1-kernel"]}
aspis-core={path="../../../crates/aspis-core",features=["r0","ct-host-prover"]}
aspis-r1-cost-probe={path="../../../crates/aspis-r1-cost-probe",features=["optimized-terminal","r1p-check","ct-host-prover"]}
[profile.release]
opt-level=3
