[package]
name = "pv-optb-failure-probe"
version = "0.0.0"
edition = "2021"
[workspace]
[dependencies]
aspis-prover = { path = "../../source/crates/aspis-prover", features = ["r0", "insecure-spend-fixture"] }
aspis-r1-cost-probe = { path = "../../source/crates/aspis-r1-cost-probe", features = ["r1p-check", "optimized-terminal"] }
[profile.release]
opt-level = 3
overflow-checks = true
[[bin]]
name = "pv-optb-failure-probe"
path = "main.rs"
