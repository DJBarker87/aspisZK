[package]
name = "bef-native-rejection"
version = "0.1.0"
edition = "2021"
[workspace]
[dependencies]
aspis-r1-cost-probe = { path = "../../../crates/aspis-r1-cost-probe" }
aspis-core = { path = "../../../crates/aspis-core", features = ["r0"] }
aspis-statement = { path = "../../../crates/aspis-statement", features = ["r0", "pool-v1-kernel"] }
sha2 = { version = "=0.10.9", features = ["force-soft"] }
[profile.release]
opt-level = 3
overflow-checks = true
