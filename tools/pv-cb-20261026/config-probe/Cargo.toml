[package]
name = "pv-cb-config-probe"
version = "0.0.0"
edition = "2021"
[workspace]
[lib]
path = "lib.rs"
[profile.dev]
opt-level = 3
overflow-checks = false
debug-assertions = false
[dependencies]
aspis-core = { path = "../source/crates/aspis-core", features = ["r0", "ct-host-prover"] }
aspis-r1-cost-probe = { path = "../source/crates/aspis-r1-cost-probe", features = ["ct-host-prover"] }
