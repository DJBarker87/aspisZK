[package]
name = "pv-cb-mask-steps"
version = "0.0.0"
edition = "2021"
[workspace]
[lib]
path = "lib.rs"
[dependencies]
aspis-core = { path = "../source/crates/aspis-core", features = ["r0", "ct-host-prover"] }
aspis-r1-cost-probe = { path = "../source/crates/aspis-r1-cost-probe", features = ["ct-host-prover"] }
aspis-statement = { path = "../source/crates/aspis-statement", features = ["r0"] }
[profile.release]
opt-level = 3
overflow-checks = false
[profile.dev]
opt-level = 3
overflow-checks = false
debug-assertions = false
