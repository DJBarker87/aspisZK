[package]
name = "aspis-fused-trace"
version = "0.1.0"
edition = "2021"
publish = false
description = "FUTURE-VERSION EXPERIMENT: LiteSVM register-trace driver for the cost inventory"

[workspace]

[dependencies]
anyhow = "1.0.100"
litesvm = { version = "=0.16.0", features = ["register-tracing"] }
agave-feature-set = "=4.2.1"
solana-account = "=4.3.2"
solana-address = "=2.6.1"
solana-compute-budget = "=4.2.1"
solana-compute-budget-interface = "=3.0.0"
solana-instruction = "=3.4.0"
solana-keypair = "=3.1.2"
solana-message = { version = "=4.4.1", features = ["wincode"] }
solana-signer = "=3.0.1"
solana-transaction = { version = "=4.1.5", features = ["wincode"] }

[profile.release]
opt-level = 3
