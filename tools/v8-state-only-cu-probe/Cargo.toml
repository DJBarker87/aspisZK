[package]
name = "aspis-v8-state-only-cu-probe"
version = "0.1.0"
edition = "2021"
publish = false
default-run = "aspis-v8-state-only-cu-probe"

[features]
r0-probe-c3 = ["r0-probe-c2", "aspis-prover/r0-probe-c3", "aspis-statement/r0-probe-c3"]
r0-probe-c2 = ["r0-probe-c1", "aspis-prover/r0-probe-c2", "aspis-statement/r0-probe-c2"]
r0-probe-c1 = ["r0-cost-probe", "aspis-prover/r0-probe-c1", "aspis-statement/r0-probe-c1"]
r0-cost-probe = ["aspis-core/r0-cost-probe", "aspis-prover/r0-cost-probe", "aspis-statement/r0-cost-probe"]
r0-op-count = ["aspis-core/r0-op-count"]

[workspace]

[dependencies]
anyhow = "1.0.100"
aspis-core = { path = "../../crates/aspis-core", features = ["r0"] }
aspis-prover = { path = "../../crates/aspis-prover", features = ["r0", "insecure-spend-fixture"] }
aspis-statement = { path = "../../crates/aspis-statement", features = ["r0"] }
litesvm = "=0.16.0"
agave-feature-set = "=4.2.1"
solana-program-runtime = "=4.2.1"
serde_json = "1"
sha2 = "0.10.8"
solana-account = "=4.3.2"
solana-address = "=2.6.1"
solana-compute-budget = "=4.2.1"
solana-compute-budget-interface = "=3.0.0"
solana-instruction = "=3.4.0"
solana-keypair = "=3.1.2"
solana-message = { version = "=4.2.4", features = ["wincode"] }
solana-signer = "=3.0.1"
solana-transaction = { version = "=4.1.5", features = ["wincode"] }
wincode = "=0.5.5"

[profile.release]
opt-level = 3
