[package]
name = "pin2-upload-litesvm"
version = "0.1.0"
edition = "2021"
publish = false
description = "LiteSVM program tests for programs/aspis-upload and the PIN2 per-payment close accounting"

# Standalone: the pins below are the ones tools/r1-cost-probe already locks
# (Cargo.lock copied from it), so nothing new is resolved.
[workspace]
exclude = ["stub-verifier"]

[dev-dependencies]
litesvm = "=0.16.0"
sha2 = "=0.10.9"
solana-account = "=4.3.2"
solana-address = "=2.6.1"
solana-instruction = "=3.4.0"
solana-keypair = "=3.1.2"
solana-message = { version = "=4.4.1", features = ["wincode"] }
solana-signer = "=3.0.1"
solana-transaction = { version = "=4.1.5", features = ["wincode"] }
wincode = "=0.5.5"
