[package]
name = "encoding-uniqueness"
version = "0.1.0"
edition = "2021"
[workspace]
[dependencies]
aspis-core = { path = "../../crates/aspis-core", features = ["r0"] }
aspis-statement = { path = "../../crates/aspis-statement", features = ["r0", "pool-v1-kernel"] }
aspis-r1-cost-probe = { path = "../../crates/aspis-r1-cost-probe", features = ["optimized-terminal"] }
aspis-pool = { path = "../../programs/aspis-pool", features = ["no-entrypoint", "r1-split-checkpoint", "pair-forest-source-invariant-audit", "pair-forest-source-result-invariant-audit"] }
solana-program = "2.3.0"
