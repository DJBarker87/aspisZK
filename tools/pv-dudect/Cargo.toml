[package]
name = "pv-dudect"
version = "0.1.0"
edition = "2021"
publish = false
[workspace]
[dependencies]
source-link = { path = "source-link" }
aspis-core = { path = "../../crates/aspis-core", features = ["r0", "ct-host-prover"] }
aspis-prover = { path = "../../crates/aspis-prover", features = ["r0", "ct-host-prover", "insecure-spend-fixture"] }
aspis-statement = { path = "../../crates/aspis-statement", features = ["r0", "pool-v1-kernel"] }
getrandom = "0.3.4"
sha2 = "=0.10.9"
zeroize = "1.8.1"
serde_json = "1"
[profile.release]
opt-level = 3
