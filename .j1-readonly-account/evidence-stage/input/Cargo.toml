[package]
name = "aspis-r1-readonly-account"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[lib]
path = "lib.rs"

[dependencies]
solana-account-info = { version = "=2.3.0", features = ["bincode"] }
solana-pubkey = { version = "=2.4.0", default-features = false, features = ["borsh", "bytemuck", "curve25519", "serde", "std"] }
solana-program-error = { version = "=2.2.2", features = ["borsh", "serde"] }
